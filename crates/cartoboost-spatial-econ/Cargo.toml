[package]
name = "cartoboost-spatial-econ"
version = "0.3.11"
edition.workspace = true
license.workspace = true
description = "Classical sparse spatial econometrics baselines for CartoBoost"

[dependencies]
cartoboost-geo-core = { path = "../cartoboost-geo-core" }
cartoboost-neural = { path = "../cartoboost-neural" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rayon = "1.11"

[features]
default = []
cuda = ["cartoboost-geo-core/cuda", "cartoboost-neural/cuda"]
cuda-oxide = ["cartoboost-geo-core/cuda-oxide", "cartoboost-neural/cuda-oxide"]
rocm = ["cartoboost-geo-core/rocm", "cartoboost-neural/rocm"]
hip = ["cartoboost-geo-core/hip", "cartoboost-neural/hip"]
metal = ["cartoboost-geo-core/metal", "cartoboost-neural/metal"]
webgpu = ["cartoboost-geo-core/webgpu", "cartoboost-neural/webgpu"]
directml = ["cartoboost-geo-core/directml", "cartoboost-neural/directml"]
