[package]
name = "cartoboost-wasm"
version = "0.3.9"
edition = "2021"
license = "MIT"
repository = "https://github.com/theculliganman/cartoboost"
description = "WebAssembly bindings for browser-based CartoBoost forecasting."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cartoboost-core = { path = "../cartoboost-core" }
cartoboost-geo-causal = { path = "../cartoboost-geo-causal" }
cartoboost-geo-core = { path = "../cartoboost-geo-core" }
cartoboost-geostats = { path = "../cartoboost-geostats" }
cartoboost-geo-st = { path = "../cartoboost-geo-st" }
cartoboost-neural = { path = "../cartoboost-neural" }
cartoboost-prob = { path = "../cartoboost-prob" }
chrono.workspace = true
console_error_panic_hook = "0.1"
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["webgpu"]
webgpu = [
    "cartoboost-core/webgpu",
    "cartoboost-geo-causal/webgpu",
    "cartoboost-geo-core/webgpu",
    "cartoboost-geostats/webgpu",
    "cartoboost-geo-st/webgpu",
    "cartoboost-neural/webgpu",
    "cartoboost-prob/webgpu",
    "dep:wasm-bindgen-futures",
]
metal = ["cartoboost-core/metal", "cartoboost-geo-causal/metal", "cartoboost-geo-core/metal", "cartoboost-geostats/metal", "cartoboost-geo-st/metal", "cartoboost-neural/metal", "cartoboost-prob/metal"]
rocm = ["cartoboost-core/rocm", "cartoboost-geo-causal/rocm", "cartoboost-geo-core/rocm", "cartoboost-geostats/rocm", "cartoboost-geo-st/rocm", "cartoboost-neural/rocm", "cartoboost-prob/rocm"]
hip = ["cartoboost-core/hip", "cartoboost-geo-causal/hip", "cartoboost-geo-core/hip", "cartoboost-geostats/hip", "cartoboost-geo-st/hip", "cartoboost-neural/hip", "cartoboost-prob/hip"]
directml = ["cartoboost-core/directml", "cartoboost-geo-causal/directml", "cartoboost-geo-core/directml", "cartoboost-geostats/directml", "cartoboost-geo-st/directml", "cartoboost-neural/directml", "cartoboost-prob/directml"]
cuda = ["cartoboost-core/cuda", "cartoboost-geo-causal/cuda", "cartoboost-geo-core/cuda", "cartoboost-geostats/cuda", "cartoboost-geo-st/cuda", "cartoboost-neural/cuda", "cartoboost-prob/cuda"]
