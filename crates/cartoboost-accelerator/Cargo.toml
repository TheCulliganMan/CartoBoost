[package]
name = "cartoboost-accelerator"
version = "0.3.11"
edition.workspace = true
license.workspace = true
description = "Cycle-free accelerator runtime and tensor kernels for CartoBoost"

[dependencies]
serde = { workspace = true }
thiserror.workspace = true
libloading = { version = "0.8", optional = true }
wgpu = { version = "29", optional = true }
futures-channel = { version = "0.3", optional = true }
libm = { version = "0.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_AI_MachineLearning_DirectML",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(target_os = "linux")'.dependencies]
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", package = "cuda-core", optional = true }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", package = "cuda-device", optional = true }
cuda-host = { git = "https://github.com/NVlabs/cuda-oxide.git", package = "cuda-host", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "visionos"))'.dependencies]
metal = { version = "0.33", optional = true }
objc = { version = "0.2.7", optional = true }

[features]
default = []
cuda = ["cuda-oxide"]
cuda-oxide = ["dep:cuda-core", "dep:cuda-device", "dep:cuda-host", "dep:libm"]
rocm = ["dep:libloading"]
hip = ["rocm"]
metal = ["dep:metal", "dep:objc"]
webgpu = ["dep:futures-channel", "dep:wgpu"]
directml = ["webgpu", "dep:windows"]
