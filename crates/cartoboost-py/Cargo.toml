[package]
name = "cartoboost-py"
version = "0.3.9"
edition.workspace = true
license.workspace = true
description = "PyO3 bindings for the CartoBoost Python package"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
cartoboost-core = { path = "../cartoboost-core" }
cartoboost-geo-causal = { path = "../cartoboost-geo-causal" }
cartoboost-geo-core = { path = "../cartoboost-geo-core" }
cartoboost-geostats = { path = "../cartoboost-geostats" }
cartoboost-geo-st = { path = "../cartoboost-geo-st" }
cartoboost-neural = { path = "../cartoboost-neural" }
cartoboost-prob = { path = "../cartoboost-prob" }
cartoboost-spatial-econ = { path = "../cartoboost-spatial-econ" }
chrono.workspace = true
numpy = "0.26"
pyo3.workspace = true
rayon = "1.11"
serde_json.workspace = true

[features]
# Optional accelerator backends are exposed by their backend names and are
# enabled only when explicitly requested at build time.
cuda = ["cartoboost-core/cuda", "cartoboost-geo-core/cuda", "cartoboost-geo-causal/cuda", "cartoboost-geo-st/cuda", "cartoboost-geostats/cuda", "cartoboost-neural/cuda", "cartoboost-prob/cuda", "cartoboost-spatial-econ/cuda"]
rocm = ["cartoboost-core/rocm", "cartoboost-geo-core/rocm", "cartoboost-geo-causal/rocm", "cartoboost-geo-st/rocm", "cartoboost-geostats/rocm", "cartoboost-neural/rocm", "cartoboost-prob/rocm", "cartoboost-spatial-econ/rocm"]
hip = ["cartoboost-core/hip", "cartoboost-geo-core/hip", "cartoboost-geo-causal/hip", "cartoboost-geo-st/hip", "cartoboost-geostats/hip", "cartoboost-neural/hip", "cartoboost-prob/hip", "cartoboost-spatial-econ/hip"]
metal = ["cartoboost-core/metal", "cartoboost-geo-core/metal", "cartoboost-geo-causal/metal", "cartoboost-geo-st/metal", "cartoboost-geostats/metal", "cartoboost-neural/metal", "cartoboost-prob/metal", "cartoboost-spatial-econ/metal"]
webgpu = ["cartoboost-core/webgpu", "cartoboost-geo-core/webgpu", "cartoboost-geo-causal/webgpu", "cartoboost-geo-st/webgpu", "cartoboost-geostats/webgpu", "cartoboost-neural/webgpu", "cartoboost-prob/webgpu", "cartoboost-spatial-econ/webgpu"]
directml = ["cartoboost-core/directml", "cartoboost-geo-core/directml", "cartoboost-geo-causal/directml", "cartoboost-geo-st/directml", "cartoboost-geostats/directml", "cartoboost-neural/directml", "cartoboost-prob/directml", "cartoboost-spatial-econ/directml"]
