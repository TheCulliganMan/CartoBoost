[package]
name = "cartoboost-py"
version = "0.3.9"
edition.workspace = true
license.workspace = true
description = "PyO3 bindings for the CartoBoost Python package"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
cartoboost-core = { path = "../cartoboost-core" }
cartoboost-geo-causal = { path = "../cartoboost-geo-causal" }
cartoboost-geo-core = { path = "../cartoboost-geo-core" }
cartoboost-geostats = { path = "../cartoboost-geostats" }
cartoboost-geo-st = { path = "../cartoboost-geo-st" }
cartoboost-neural = { path = "../cartoboost-neural" }
cartoboost-prob = { path = "../cartoboost-prob" }
cartoboost-spatial-econ = { path = "../cartoboost-spatial-econ" }
chrono.workspace = true
numpy = "0.26"
pyo3.workspace = true
rayon = "1.11"
serde_json.workspace = true

[features]
# Optional accelerator backends are exposed by their backend names and are
# enabled only when explicitly requested at build time.
cuda = ["cartoboost-geo-st/cuda", "cartoboost-neural/cuda"]
rocm = ["cartoboost-geo-st/rocm", "cartoboost-neural/rocm"]
metal = ["cartoboost-geo-st/metal", "cartoboost-neural/metal"]
webgpu = ["cartoboost-geo-st/webgpu", "cartoboost-neural/webgpu"]
