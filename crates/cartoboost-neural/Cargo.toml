[package]
name = "cartoboost-neural"
version = "0.2.41"
edition.workspace = true
license.workspace = true

[dependencies]
cartoboost-core = { path = "../cartoboost-core" }
chrono.workspace = true
rayon = "1.11"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror.workspace = true
libloading = { version = "0.8", optional = true }
wgpu = { version = "29", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "visionos"))'.dependencies]
metal = { version = "0.33", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
cuda = ["dep:libloading"]
rocm = ["dep:libloading"]
metal = ["dep:metal"]
webgpu = ["dep:wgpu"]
