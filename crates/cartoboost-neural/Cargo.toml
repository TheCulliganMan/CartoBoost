[package]
name = "cartoboost-neural"
version = "0.3.11"
edition.workspace = true
license.workspace = true

[dependencies]
cartoboost-core = { path = "../cartoboost-core" }
cartoboost-accelerator = { path = "../cartoboost-accelerator" }
chrono.workspace = true
rayon = "1.11"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror.workspace = true


[dev-dependencies]
tempfile = "3"

[features]
default = []
# `cuda` remains the public feature used by downstream crates, but its only
# implementation is CUDA Oxide.  Do not add a driver/NVRTC fallback here.
cuda = ["cuda-oxide"]
cuda-oxide = ["cartoboost-accelerator/cuda-oxide"]
rocm = ["cartoboost-accelerator/rocm"]
hip = ["rocm"]
metal = ["cartoboost-accelerator/metal"]
webgpu = ["cartoboost-accelerator/webgpu"]
directml = ["cartoboost-accelerator/directml"]
