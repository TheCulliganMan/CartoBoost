[package]
name = "cartoboost-cli"
version = "0.3.9"
edition = "2021"
license = "MIT"
description = "Command-line smoke-test interface for CartoBoost workflows"

[[bin]]
name = "cartoboost"
path = "src/main.rs"

[dependencies]
cartoboost-core = { path = "../cartoboost-core" }
cartoboost-neural = { path = "../cartoboost-neural" }

[features]
default = []
cuda = ["cartoboost-core/cuda", "cartoboost-neural/cuda"]
cuda-oxide = ["cartoboost-neural/cuda-oxide"]
rocm = ["cartoboost-core/rocm", "cartoboost-neural/rocm"]
hip = ["rocm", "cartoboost-core/hip", "cartoboost-neural/hip"]
metal = ["cartoboost-core/metal", "cartoboost-neural/metal"]
directml = ["cartoboost-core/directml", "cartoboost-neural/directml"]
webgpu = ["cartoboost-core/webgpu", "cartoboost-neural/webgpu"]
