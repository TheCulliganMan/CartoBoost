[package]
name = "cartoboost-prob"
version = "0.3.11"
edition.workspace = true
license.workspace = true
description = "Probabilistic prediction, calibration, and distributional metrics for CartoBoost."

[dependencies]
cartoboost-core = { path = "../cartoboost-core" }
cartoboost-neural = { path = "../cartoboost-neural" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rayon = "1.11"

[features]
default = []
cuda = ["cartoboost-neural/cuda"]
cuda-oxide = ["cartoboost-neural/cuda-oxide"]
rocm = ["cartoboost-neural/rocm"]
hip = ["cartoboost-neural/hip"]
metal = ["cartoboost-neural/metal"]
webgpu = ["cartoboost-neural/webgpu"]
directml = ["cartoboost-neural/directml"]
