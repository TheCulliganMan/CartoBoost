[advisories]
version = 2
# `paste` is pulled only by the optional Metal backend. The advisory
# reports no safe upgrade; stable CPU wheels do not enable this dependency.
# Chrono has no patched version for this informational unmaintained advisory.
# The workspace shares its timestamp types across model, PyO3, and WASM APIs;
# replacing those contracts is outside the Python interpreter support change.
ignore = ["RUSTSEC-2026-0543", "RUSTSEC-2024-0436"]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# The existing fuzz harness bundles LLVM's libFuzzer under its NCSA license.
# Keep this allowance specific to the development-only fuzzing dependency.
[[licenses.exceptions]]
name = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/NVlabs/cuda-oxide.git"]
