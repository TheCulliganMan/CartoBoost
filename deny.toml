[advisories]
version = 2
# PyO3 0.26 supports CPython 3.14's free-threaded build. CartoBoost does not
# call `PyCFunction::new_closure`; revisit this exception on the next PyO3
# upgrade.
# `paste` is pulled only by the optional Metal backend. The advisory
# reports no safe upgrade; stable CPU wheels do not enable this dependency.
# CartoBoost does not use the PyList/PyTuple iterator or closure APIs covered by
# the PyO3 advisories.
ignore = ["RUSTSEC-2026-0176", "RUSTSEC-2026-0177", "RUSTSEC-2024-0436"]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
