[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "cartoboost"
version = "0.3.9"
description = "Rust-backed spatial boosting for tabular modeling and forecasting."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Ryan Culligan" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["boosting", "gradient-boosting", "machine-learning", "python", "rust"]
dependencies = [
    "numpy>=1.23; python_version < '3.13'",
    "numpy>=2.1; python_version >= '3.13'",
    "scikit-learn>=1.2",
    "scipy>=1.16; python_version >= '3.14'",
    "pandas>=2.0,<3",
    "duckdb>=1.0",
    "shap>=0.49.1,<0.50",
    "h3>=4.0",
    "holidays>=0.50,<0.99",
    "s2sphere>=0.2",
    "onnx>=1.16",
    "optuna>=4.0",
    "tensorboardX>=2.6",
    "torch>=2.1,<2.5; python_version < '3.13'",
    "torch>=2.7; python_version >= '3.13'",
    "geopandas>=1.0",
    "matplotlib>=3.7",
    "pydeck>=0.9",
    "shapely>=2.0",
    "polars>=1.0",
    "chronos-forecasting>=1.5",
    "timesfm>=1.2",
    "uni2ts>=1.2; python_version < '3.13'",
    "nixtla>=0.6",
    "tabpfn>=2.0",
]

[dependency-groups]
bench = [
    "catboost>=1.2",
    "darts>=0.30",
    "datasetsforecast>=1.0",
    "esda>=2.6",
    "functime>=0.9",
    "gstools>=1.6",
    "holidays>=0.50,<0.99",
    "libpysal>=4.10",
    "lightgbm>=4.0",
    "neuralforecast>=1.7",
    "prophet>=1.1,<1.3",
    "pyarrow>=14.0",
    "pykrige>=1.7",
    "scikit-learn>=1.2",
    "spreg>=1.4",
    "statsforecast>=1.7",
    "xgboost>=2.0",
]
dev = [
    "duckdb>=1.0",
    "hypothesis>=6.100",
    "maturin>=1.7,<2",
    "matplotlib>=3.7",
    "optuna>=4.0",
    "pandas>=2.0,<3",
    "polars>=1.0",
    "pre-commit>=4.6.0",
    "pyarrow>=14.0",
    "pytest>=8",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "scikit-learn>=1.2",
    "scipy>=1.14; python_version >= '3.13'",
    "ty>=0.0.50",
]
[project.urls]
Homepage = "https://github.com/theculliganman/cartoboost"
Repository = "https://github.com/theculliganman/cartoboost"
Issues = "https://github.com/theculliganman/cartoboost/issues"

[tool.maturin]
manifest-path = "crates/cartoboost-py/Cargo.toml"
module-name = "cartoboost._native"
python-source = "python"
features = ["pyo3/extension-module"]
bindings = "pyo3"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
addopts = ["-p", "no:fugue_test", "-p", "no:fugue_test_fixtures"]

[tool.coverage.report]
# Keep the release suite from silently losing coverage as supported modules are
# removed or the stable surface changes.  Raise this floor deliberately when
# the maintained test matrix improves; never lower it to accommodate a
# failing release.
fail_under = 35
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"
unsupported-operator = "ignore"
