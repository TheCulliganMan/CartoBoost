name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: PYO3_PYTHON=python3 cargo test --workspace

  rust-compatibility:
    name: Rust compatibility (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", "stable"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Test workspace
        run: PYO3_PYTHON=python3 cargo test --workspace

  quality-controls:
    name: UI, fuzz, and dependency audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install UI dependencies
        run: npm ci

      - name: Typecheck UI
        run: npm run typecheck

      - name: Run UI tests
        run: npm run test:ui

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

      - name: Audit Rust dependencies and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Audit Python dependency resolution
        run: |
          uv sync --group dev
          uv pip check

  nightly-fuzz:
    name: Timed fuzz smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust and cargo-fuzz
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Run timed fuzz targets
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run train_small_dataset -- -max_total_time=60
          cargo +nightly fuzz run predict_one -- -max_total_time=60

  python:
    name: Python (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.14t"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.os }}-${{ steps.setup-python.outputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python environment
        if: ${{ !startsWith(matrix.python-version, '3.14') }}
        run: uv sync --python ${{ matrix.python-version }}

      - name: Sync Python 3.14 runtime environment
        if: ${{ startsWith(matrix.python-version, '3.14') }}
        run: uv sync --no-group dev --python ${{ matrix.python-version }}

      - name: Lint and format
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run --group dev pre-commit run --all-files

      - name: Install native extension
        if: ${{ !startsWith(matrix.python-version, '3.14') }}
        run: uv run maturin develop

      - name: Release gate audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run python scripts/check_release_gates.py

      - name: Public API contract audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run python scripts/check_public_api_contract.py

      - name: Artifact compatibility audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run python scripts/check_artifact_compatibility.py

      - name: Docs example audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run python scripts/check_docs_examples.py

      - name: Official geo evidence audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run python scripts/check_official_geo_evidence.py

      - name: Performance threshold audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run python scripts/check_performance_thresholds.py

      - name: Import performance audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run python scripts/check_import_performance.py

      - name: Benchmark provenance freshness audit
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv run python scripts/run_scale_performance_gate.py \
            --rows 10000 \
            --threads 2 \
            --estimators 4 \
            --output target/scale-performance.json
          uv run python scripts/check_scale_performance_gate.py \
            target/scale-performance.json \
            --minimum-rows 10000 \
            --minimum-predict-rows-per-second 0 \
            --minimum-thread-speedup 0 \
            --allow-missing-thread-speedup
          uv run python scripts/run_model_benchmark_suite.py \
            --output-dir target/benchmark-freshness \
            --datasets normal \
            --models mean,cartoboost \
            --n-rows 120 \
            --n-estimators 4 \
            --no-plots
          uv run python scripts/check_benchmark_freshness.py \
            --artifact target/benchmark-freshness/results.json \
            --artifact docs/assets/nyc_taxi_benchmarks/forecasting_library_benchmark_real.json
          uv run python scripts/check_forecasting_quality_gate.py \
            --artifact docs/assets/nyc_taxi_benchmarks/forecasting_library_benchmark_real.json
          uv run python scripts/check_nyc_row_quality_gate.py \
            docs/assets/nyc_taxi_benchmarks/results.json

      - name: Test Python
        if: ${{ !startsWith(matrix.python-version, '3.14') }}
        run: uv run pytest tests/forecasting tests/python/test_v03_contract.py tests/python/test_private_shadow_gate.py tests/python/test_model_registry.py tests/python/test_feature_schema.py tests/python/test_benchmark_manifests.py tests/integration -q --cov=python/cartoboost --cov-report=term-missing --cov-fail-under=35

      - name: Test Python 3.14 import and native concurrency
        if: matrix.python-version == '3.14'
        shell: bash
        run: |
          uv run --no-group dev python - <<'PY'
          import concurrent.futures
          from cartoboost import CartoBoostRegressor

          def fit_and_predict(seed):
              model = CartoBoostRegressor(n_estimators=4, max_depth=2, min_samples_leaf=1)
              model.fit([[0.0], [1.0], [2.0], [3.0]], [seed, seed + 1, seed + 2, seed + 3])
              return model.predict([[1.5]])[0]

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              values = list(pool.map(fit_and_predict, range(4)))

          assert all(isinstance(value, float) for value in values)
          PY

      - name: Test free-threaded Python import and native concurrency
        if: matrix.python-version == '3.14t'
        shell: bash
        env:
          PYTHON_GIL: "0"
        run: |
          uv run --no-group dev python - <<'PY'
          import concurrent.futures
          import sysconfig
          import warnings

          with warnings.catch_warnings(record=True) as caught:
              warnings.simplefilter("always")
              from cartoboost import CartoBoostRegressor

          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert not [warning for warning in caught if "GIL" in str(warning.message)]

          def fit_and_predict(seed):
              model = CartoBoostRegressor(n_estimators=4, max_depth=2, min_samples_leaf=1)
              model.fit([[0.0], [1.0], [2.0], [3.0]], [seed, seed + 1, seed + 2, seed + 3])
              return model.predict([[1.5]])[0]

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              values = list(pool.map(fit_and_predict, range(4)))

          assert all(isinstance(value, float) for value in values)
          PY

  validation:
    name: Validation artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python environment
        run: uv sync --python 3.12

      - name: Install native extension
        run: uv run maturin develop

      - name: Generate validation artifacts
        run: uv run python scripts/run_full_validation.py

      - name: Generate v1 validation report
        run: uv run python scripts/run_v1_validation.py

  bench-compile:
    name: Benchmark compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Compile benchmarks
        run: cargo bench --workspace --no-run

  package-smoke:
    name: Built package smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync build environment
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Build wheel
        run: uv run maturin build --release --out dist

      - name: Install wheel in clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv target/package-smoke-venv
          if [ -x target/package-smoke-venv/bin/python ]; then
            SMOKE_PYTHON=target/package-smoke-venv/bin/python
          else
            SMOKE_PYTHON=target/package-smoke-venv/Scripts/python.exe
          fi
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$WHEEL"
          "$SMOKE_PYTHON" -m pip install --upgrade pip
          "$SMOKE_PYTHON" -m pip install numpy pandas
          "$SMOKE_PYTHON" -m pip install --no-deps "$WHEEL"
          "$SMOKE_PYTHON" - <<'PY'
          import numpy as np
          import os
          import tempfile
          from importlib.metadata import entry_points, metadata
          import cartoboost
          from cartoboost import CartoBoostRegressor, BoosterConfig
          from cartoboost.schema import FeatureSchema, NumericSpec

          assert "pandas" in (metadata("cartoboost").get_all("Provides-Extra") or [])
          assert not any(ep.name == 'cartoboost' for ep in entry_points(group='console_scripts'))
          assert cartoboost.__version__
          assert cartoboost.__all__ == [
              'CartoBoostRegressor', 'CartoBoostClassifier', 'CartoBoostRanker',
              'BoosterConfig', '__version__'
          ]
          assert not hasattr(cartoboost, 'AutoGeoModel')
          FeatureSchema.from_specs([NumericSpec('distance')]).validate(1, [])
          x = np.arange(96, dtype=float).reshape(48, 2)
          y = x[:, 0] * 0.25 - x[:, 1] * 0.1
          model = CartoBoostRegressor(n_estimators=4, max_depth=2, min_samples_leaf=1)
          model.fit(x, y)
          assert model.predict(x).shape == (48,)
          with tempfile.TemporaryDirectory() as temp_dir:
              artifact = os.path.join(temp_dir, 'model.json')
              model.save(artifact)
              restored = CartoBoostRegressor.load(artifact)
              np.testing.assert_allclose(model.predict(x), restored.predict(x), atol=1e-12, rtol=0.0)
          PY
