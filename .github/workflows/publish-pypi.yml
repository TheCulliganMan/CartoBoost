name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-checks:
    name: Release checks
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify tag, version, and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check_release_versions.py --tag "$RELEASE_TAG"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Recheck release gate contract
        run: python scripts/check_release_gates.py

      - name: Require successful CI for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                head_sha: context.sha,
                per_page: 100,
              },
            );
            // A tag must be backed by the required push-to-main CI run.  A
            // successful pull-request or workflow-dispatch run is not enough
            // evidence that protected main accepted this exact commit.
            const successful = runs.find(
              (run) =>
                run.event === 'push' &&
                run.head_branch === 'main' &&
                run.status === 'completed' &&
                run.conclusion === 'success',
            );
            if (!successful) {
              core.setFailed(`No successful push-to-main CI run found for ${context.sha}`);
            } else {
              core.info(`Using successful CI run ${successful.id}`);
            }

  sdist:
    name: Source distribution
    needs: release-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheels (${{ matrix.platform.name }}, py${{ matrix.python-version }})
    needs: release-checks
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - name: linux-aarch64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: auto
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: auto
        exclude:
          - platform:
              name: windows-aarch64
              runner: windows-11-arm
              target: aarch64-pc-windows-msvc
              manylinux: auto
            python-version: "3.10"

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        id: setup-wheel-python
        if: ${{ !startsWith(matrix.platform.name, 'linux-') }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-wheels-${{ matrix.platform.target }}-${{ steps.setup-wheel-python.outputs.python-version || matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: >-
            --release
            --compatibility pypi
            --out dist
            --interpreter ${{ startsWith(matrix.platform.name, 'linux-') && format('python{0}', matrix.python-version) || 'python' }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}-py${{ matrix.python-version }}
          path: dist/*.whl

  smoke:
    name: Wheel smoke (${{ matrix.platform.name }}, py${{ matrix.python-version }})
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            platform: linux-x86_64
            runner: ubuntu-latest
            python-version: "3.10"
          - name: linux-x86_64
            platform: linux-x86_64
            runner: ubuntu-latest
            python-version: "3.13"
          - name: linux-x86_64
            platform: linux-x86_64
            runner: ubuntu-latest
            python-version: "3.14t"
          - name: macos-aarch64
            platform: macos-aarch64
            runner: macos-15
            python-version: "3.10"
          - name: macos-aarch64
            platform: macos-aarch64
            runner: macos-15
            python-version: "3.13"
          - name: macos-aarch64
            platform: macos-aarch64
            runner: macos-15
            python-version: "3.14t"
          - name: windows-x86_64
            platform: windows-x86_64
            runner: windows-latest
            python-version: "3.10"
          - name: windows-x86_64
            platform: windows-x86_64
            runner: windows-latest
            python-version: "3.13"
          - name: windows-x86_64
            platform: windows-x86_64
            runner: windows-latest
            python-version: "3.14t"
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}-py${{ matrix.python-version }}
          path: dist

      - name: Install and smoke test wheel
        shell: bash
        run: |
          python -m pip install numpy pandas
          python -m pip install --no-deps dist/*.whl
          python -c "import cartoboost; print(cartoboost.__version__)"
          python - <<'PY'
          import numpy as np
          import os
          import tempfile
          from importlib.metadata import entry_points
          from cartoboost import CartoBoostRegressor

          assert not any(ep.name == 'cartoboost' for ep in entry_points(group='console_scripts'))
          x = np.arange(96, dtype=float).reshape(48, 2)
          y = x[:, 0] * 0.25 - x[:, 1] * 0.1
          model = CartoBoostRegressor(n_estimators=4, max_depth=2)
          model.fit(x, y)
          assert model.predict(x).shape == (48,)

          import pandas as pd
          from cartoboost.forecasting import CartoBoostLagForecaster, ForecastFrame, LagConfig
          frame = ForecastFrame.from_pandas(
              pd.DataFrame({
                  'timestamp': pd.date_range('2024-01-01', periods=40, freq='D'),
                  'target': np.arange(40, dtype=float),
              }),
              timestamp_col='timestamp', target_col='target', freq='D',
          )
          forecast = CartoBoostLagForecaster(
              lag_config=LagConfig(lags=[1, 2]), n_estimators=4,
              max_depth=2, min_samples_leaf=1,
          ).fit(frame)
          with tempfile.TemporaryDirectory() as temp_dir:
              artifact = os.path.join(temp_dir, 'forecast.json')
              forecast.save(artifact)
              restored = CartoBoostLagForecaster.load(artifact)
              assert forecast.predict(2).predictions() == restored.predict(2).predictions()
          PY

  smoke-sdist:
    name: Source distribution smoke
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Build and smoke test source distribution
        run: |
          python -m pip install --no-cache-dir dist/*.tar.gz
          python -c "import cartoboost; print(cartoboost.__version__)"

  publish:
    name: Publish to PyPI
    needs: [release-checks, sdist, wheels, smoke, smoke-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cartoboost
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Check distributions
        run: |
          python -m pip install --upgrade pip packaging twine
          python -m twine check dist/*

      - name: Attest distributions
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Create release for the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "CartoBoost $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/* --clobber
